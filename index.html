 cartões é automática: o sistema aplica as taxas e mostra se a operadora descontou certo, a mais ou a menos."},{q:"O CliCar app atende redes com mais de uma unidade?",a:"Sim. O controle multiempresas reúne as empresas da rede no mesmo sistema, com estoque integrado entre elas."},{q:"Qual é a diferença entre “WhatsApp integrado” e “IA SDR no WhatsApp”?",a:"O WhatsApp integrado está presente desde o Plano 1: sua equipe conecta e gerencia dispositivos, visualiza e atende conversas e usa mensagens rápidas. A IA SDR no WhatsApp é exclusiva do Plano 4: um agente configurável que atende o cliente, qualifica o contato, coleta as informações e faz o agendamento 100% automático, sem intervenção humana, seguindo as suas regras comerciais e de agendamento."},{q:"Em qual plano estão o financeiro e o módulo fiscal e contábil?",a:"O financeiro começa no Plano 2, com contas a pagar e a receber, caixa, contas financeiras e relatórios básicos. A partir do Plano 3 entram conciliação bancária e de cartões, DRE, DRF, fluxo de caixa e demais recursos avançados, além de todas as funções disponíveis do módulo Fiscal e contábil."},{q:"A emissão fiscal, a conciliação e o WhatsApp funcionam assim que o plano é contratado?",a:"Esses recursos fazem parte do produto, mas o uso operacional depende das configurações e integrações necessárias, como a conexão do WhatsApp e os serviços fiscais, bancários e de cartão envolvidos. A equipe pode explicar o que é preciso configurar na sua operação durante a demonstração."},{q:"Como saber qual plano é o certo para a minha oficina?",a:"Se você precisa organizar orçamentos, ordens de serviço, catálogo e atendimento pelo WhatsApp, o Plano 1 cobre o essencial. Para controlar financeiro, comissões e relacionamento com clientes, veja o Plano 2. Para fiscal e contábil, conciliações e automações, o Plano 3. Para contar com a IA SDR no WhatsApp e integrações via API e webhooks, o Plano 4. Use a tabela comparativa para conferir cada recurso."},{q:"Os valores informa
